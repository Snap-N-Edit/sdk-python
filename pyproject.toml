[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "snapnedit"
version = "0.1.1"
description = "Official Python client for the snapnedit AI photo-editing API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "snapnedit", email = "support@snapnedit.com" }]
keywords = [
  "snapnedit",
  "image",
  "photo",
  "ai",
  "remove-background",
  "upscale",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://snapnedit.com"
Documentation = "https://snapnedit.com/docs/api-reference"
Source = "https://github.com/Snap-N-Edit/sdk-python"
Issues = "https://github.com/Snap-N-Edit/sdk-python/issues"
Changelog = "https://github.com/Snap-N-Edit/sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/snapnedit"]

[tool.hatch.build.targets.sdist]
include = ["src/snapnedit", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "conformance: runs against a live `node scripts/conformance-server.mjs` from the snapnedit monorepo",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ANN201", "ANN001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]
